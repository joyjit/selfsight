name: release

# Runs when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
# Publishes two things the docs promise: a container image, and standalone
# binaries. Until the first tag exists, neither is available — README.md and
# MIGRATING.md tell users to build locally, which always works.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload binaries
  packages: write # push the image to ghcr

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dashboard is embedded into the binary via go:embed, so it has to
      # exist before the Go build runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm --prefix web ci && npm --prefix web run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/selfsight-${os}-${arch}"
            echo "building ${out}"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$out" ./cmd/selfsight
          done
          (cd dist && sha256sum selfsight-* > SHA256SUMS)
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr paths must be lowercase; github.repository already is for this
      # repo, but metadata-action normalizes it either way.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
